services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:?Configure LOCAL_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-curso_ingles_db}
      MARIADB_USER: ${DB_USER:-english_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - english_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  english_mariadb:
